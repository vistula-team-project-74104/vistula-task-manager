<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
        form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        input, button { padding: 8px; font-size: 14px; }
        .task-item { border: 1px solid #ccc; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
        .task-title { font-weight: bold; }
        .task-item.done .task-title { text-decoration: line-through; }
        .task-status { display: inline-block; margin-left: 8px; font-size: 12px; color: #555; }
        #status-message { min-height: 20px; margin-bottom: 10px; color: #b00020; }
    </style>
</head>
<body>
<h1>Task Manager</h1>
<p>Student ID: <span id="student-id">74104</span></p>

<form id="task-form">
    <input type="text" id="task-title" placeholder="Task title" required>
    <input type="text" id="task-description" placeholder="Task description">
    <button type="submit" id="task-submit">Add task</button>
</form>

<div id="status-message"></div>
<div id="task-list"></div>

<p><a id="contribution-link" href="contribution.html">Team Contribution</a></p>

<script src="app.js"></script>
</body>
</html>
